# HTTP (certbot + HTTPS redirect)
server {
  listen 80;
  server_name staging.doowell.kro.kr;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS
server {
  listen 443 ssl;
  server_name staging.doowell.kro.kr;

  ssl_certificate /etc/letsencrypt/live/staging.doowell.kro.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging.doowell.kro.kr/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;

  # Frontend (SPA)
  location / {
    proxy_pass http://frontend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Backend API
  location /api {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
