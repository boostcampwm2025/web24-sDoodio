version: '3.9'

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: web24-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      - web-network
    command: >
      /bin/sh -c "while :; do sleep 24h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: web24-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"
    networks:
      - web-network

  frontend:
    image: ghcr.io/boostcampwm2025/web24-sdoodio-frontend:production
    container_name: web24-frontend-prod
    restart: unless-stopped
    expose:
      - '8080'
    networks:
      - web-network

  backend:
    image: ghcr.io/boostcampwm2025/web24-sdoodio-backend:production
    container_name: web24-backend-prod
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS}
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE}
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      CLOVA_API_KEY: ${CLOVA_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_MAX_AGE_MS: ${SESSION_MAX_AGE_MS}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENV: ${SENTRY_ENV}
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    networks:
      - web-network

networks:
  web-network:
    external: true

volumes:
  certbot-www:
  certbot-conf:
