# HTTP (Redirect to HTTPS & Certbot Challenge)
server {
  listen 80;
  server_name doowell.n-e.kr staging.doowell.n-e.kr;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS Configuration
server {
  listen 443 ssl;
  server_name doowell.n-e.kr;

  # SSL Certificates (Note: Issuance required before Nginx starts)
  ssl_certificate /etc/letsencrypt/live/doowell.n-e.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/doowell.n-e.kr/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # Production Frontend
  location / {
    proxy_pass http://web24-frontend-prod:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Production Backend
  location /api {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://web24-backend-prod:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# Staging Configuration (Subdomain)
server {
  listen 443 ssl;
  server_name staging.doowell.n-e.kr;

  ssl_certificate /etc/letsencrypt/live/doowell.n-e.kr/fullchain.pem; # Valid if using SAN certificate
  ssl_certificate_key /etc/letsencrypt/live/doowell.n-e.kr/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;

  # Staging Frontend
  location / {
    proxy_pass http://web24-frontend-staging:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Staging Backend
  location /api {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://web24-backend-staging:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
