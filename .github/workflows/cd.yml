name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      target:
        description: Job to run
        type: choice
        required: true
        default: all
        options:
          - all
          - build-and-push
          - deploy-staging
          - deploy-production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME_BACKEND: boostcampwm2025/web24-sdoodio-backend
      IMAGE_NAME_FRONTEND: boostcampwm2025/web24-sdoodio-frontend
      DEPLOY_TAG: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      TARGET: ${{ inputs.target || 'all' }}
    steps:
      - name: Skip build (deploy-only)
        if: ${{ env.TARGET == 'deploy-staging' || env.TARGET == 'deploy-production' }}
        run: echo "Skipping build-and-push."

      - name: Checkout code
        if: ${{ env.TARGET == 'all' || env.TARGET == 'build-and-push' }}
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: ${{ env.TARGET == 'all' || env.TARGET == 'build-and-push' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ env.TARGET == 'all' || env.TARGET == 'build-and-push' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: ${{ env.TARGET == 'all' || env.TARGET == 'build-and-push' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ env.DEPLOY_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}

      - name: Build and push frontend image
        if: ${{ env.TARGET == 'all' || env.TARGET == 'build-and-push' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ env.DEPLOY_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}

  deploy-staging:
    if: github.ref == 'refs/heads/develop' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'deploy-staging')
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || '22' }}
          script: |
            set -e
            cd ${{ secrets.STAGING_APP_PATH }}
            git fetch --all
            git checkout develop
            git pull
            export DB_HOST="${{ secrets.STAGING_DB_HOST }}"
            export DB_PORT="${{ secrets.STAGING_DB_PORT }}"
            export DB_USER="${{ secrets.STAGING_DB_USER }}"
            export DB_PASS="${{ secrets.STAGING_DB_PASS }}"
            export DB_NAME="${{ secrets.STAGING_DB_NAME }}"
            export CLOVA_API_KEY="${{ secrets.STAGING_CLOVA_API_KEY }}"
            export SESSION_SECRET="${{ secrets.STAGING_SESSION_SECRET }}"
            export SESSION_MAX_AGE_MS="${{ secrets.STAGING_SESSION_MAX_AGE_MS }}"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose -f infra/staging/docker-compose.staging.yml pull
            docker compose -f infra/staging/docker-compose.staging.yml run --rm backend node ./node_modules/typeorm/cli.js -d ./dist/common/database/data-source.js migration:run
            docker compose -f infra/staging/docker-compose.staging.yml up -d

  deploy-production:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'deploy-production')
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || '22' }}
          script: |
            set -e
            cd ${{ secrets.PROD_APP_PATH }}
            git fetch --all
            git checkout main
            git pull
            export DB_HOST="${{ secrets.PROD_DB_HOST }}"
            export DB_PORT="${{ secrets.PROD_DB_PORT }}"
            export DB_USER="${{ secrets.PROD_DB_USER }}"
            export DB_PASS="${{ secrets.PROD_DB_PASS }}"
            export DB_NAME="${{ secrets.PROD_DB_NAME }}"
            export CLOVA_API_KEY="${{ secrets.PROD_CLOVA_API_KEY }}"
            export SESSION_SECRET="${{ secrets.PROD_SESSION_SECRET }}"
            export SESSION_MAX_AGE_MS="${{ secrets.PROD_SESSION_MAX_AGE_MS }}"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose -f infra/prod/docker-compose.prod.yml pull
            docker compose -f infra/prod/docker-compose.prod.yml run --rm backend node ./node_modules/typeorm/cli.js -d ./dist/common/database/data-source.js migration:run
            docker compose -f infra/prod/docker-compose.prod.yml up -d
